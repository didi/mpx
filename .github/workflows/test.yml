name: test

on:
  workflow_dispatch:

jobs:
  diagnose-unit-cache:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base
            ref: 8719a9244aede2be25ccfd3c6f0e9d25595387ab
          - case: pr
            ref: 2a8d197fd8cdf208a4350f694757647e4c283b4e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Restore the exact failing cache without saving
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            node_modules
            test/e2e/miniprogram-project/node_modules
            test/e2e/plugin-project/node_modules
            packages/*/node_modules
          key: unit-Linux-X64-node-modules-v2-456049abbd5301c0f7b21eed491b796449f0c5e648f80898c56beff84921d68f
      - name: Diagnose cached installation (${{ matrix.case }})
        shell: bash
        run: |
          node --version
          npm --version
          npm i --no-audit --no-fund > /tmp/root-install.log 2>&1
          fixture=test/e2e/miniprogram-project
          webpackPackage="$PWD/node_modules/webpack/package.json"
          cp "$webpackPackage" /tmp/webpack-package-original.json
          trap 'cp /tmp/webpack-package-original.json "$webpackPackage"' EXIT
          cp -a --reflink=auto "$fixture" /tmp/fixture-original
          cat > /tmp/inspect-version-case.cjs <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const dir = 'test/e2e/miniprogram-project'
          const entry = path.join(dir, 'node_modules/webpack')
          const wanted = JSON.parse(fs.readFileSync(path.join(dir,'package.json'),'utf8'))
          const actual = JSON.parse(fs.readFileSync(path.join(entry,'package.json'),'utf8'))
          const lockPath = path.join(dir,'node_modules/.package-lock.json')
          const lock = fs.existsSync(lockPath) ? JSON.parse(fs.readFileSync(lockPath,'utf8')) : {}
          const hidden = (lock.packages || {})['node_modules/webpack']
          console.log(JSON.stringify({case:process.argv[2],requested:wanted.devDependencies.webpack,actual:actual.version,link:fs.lstatSync(entry).isSymbolicLink(),prepare:actual.scripts.prepare,hiddenVersion:hidden && hidden.version}))
          NODE
          cat > /tmp/align-webpack-versions.cjs <<'NODE'
          const fs = require('fs')
          const dir = 'test/e2e/miniprogram-project'
          const root = JSON.parse(fs.readFileSync('package-lock.json','utf8'))
          const entry = root.packages['node_modules/webpack']
          const packagePath = `${dir}/package.json`
          const pkg = JSON.parse(fs.readFileSync(packagePath,'utf8'))
          pkg.devDependencies.webpack = entry.version
          fs.writeFileSync(packagePath, JSON.stringify(pkg,null,2)+'\n')
          const lockPath = `${dir}/node_modules/.package-lock.json`
          const stat = fs.statSync(lockPath)
          const lock = JSON.parse(fs.readFileSync(lockPath,'utf8'))
          lock.packages['node_modules/webpack'] = Object.assign({},entry,{dev:true})
          fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n')
          fs.utimesSync(lockPath,stat.atime,stat.mtime)
          NODE
          restoreFixture() {
            rm -rf "$fixture"
            cp -a --reflink=auto /tmp/fixture-original "$fixture"
          }
          runCase() {
            caseName="$1"
            printf '::group::%s\n' "$caseName"
            node /tmp/inspect-version-case.cjs "$caseName"
            command -v husky || true
            timeout 180 npm i --prefix "$fixture" --foreground-scripts --loglevel=verbose --no-audit --no-fund > "/tmp/$caseName.log" 2>&1
            caseStatus=$?
            tail -n 70 "/tmp/$caseName.log"
          node /tmp/inspect-version-case.cjs "${caseName}_after"
            printf 'MATRIX case=%s status=%s\n' "$caseName" "$caseStatus"
            printf '::endgroup::\n'
          }
          set +e
          restoreFixture
          runCase cached_link
          restoreFixture
          node /tmp/align-webpack-versions.cjs
          runCase matching_versions_link
          restoreFixture
          node /tmp/align-webpack-versions.cjs
          unlink "$fixture/node_modules/webpack"
          cp -a --reflink=auto "$PWD/node_modules/webpack" "$fixture/node_modules/webpack"
          runCase matching_versions_directory
          restoreFixture
          node - <<'NODE'
          const fs = require('fs')
          const p='node_modules/webpack/package.json'
          const data=JSON.parse(fs.readFileSync(p,'utf8'))
          delete data.scripts.prepare
          fs.writeFileSync(p,JSON.stringify(data,null,2)+'\n')
          NODE
          runCase link_without_prepare
          cp /tmp/webpack-package-original.json "$webpackPackage"
          restoreFixture
          npm i --prefix /tmp/husky-tool husky@9.0.11 --ignore-scripts --no-audit --no-fund --loglevel=error > /tmp/husky-install.log 2>&1
          toolStatus=$?
          printf 'HUSKY_TOOL_SETUP status=%s\n' "$toolStatus"
          PATH="/tmp/husky-tool/node_modules/.bin:$PATH" runCase link_with_husky
          exit 0
