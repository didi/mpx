<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <title>Mpx Portal</title>
    <style>
      html { font-size: 13.333333vw; }
      html, body, #app { min-height: 100%; }
      body { margin: 0; background: #f5f7fb; }
      @media (min-width: 750px) { html { font-size: 100px; } }
      @media (min-width: 768px) {
        body { scrollbar-color: #b8c3d1 #f5f7fb; scrollbar-width: thin; }
        body::-webkit-scrollbar { width: 8px; height: 8px; }
        body::-webkit-scrollbar-track { background: #f5f7fb; }
        body::-webkit-scrollbar-thumb { border: 2px solid #f5f7fb; border-radius: 8px; background: #b8c3d1; }
        body::-webkit-scrollbar-thumb:hover { background: #8796a8; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
