<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7fb">
    <title>Mpx Portal</title>
    <style>
      html {
        font-size: 13.333333vw;
        background: #f4f7fb;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: #f4f7fb;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      @media (min-width: 750px) {
        html {
          font-size: 100px;
        }
      }

      @media (hover: hover) and (pointer: fine) {
        html {
          scrollbar-color: #9aabc2 #eef2f7;
          scrollbar-width: thin;
        }

        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }

        ::-webkit-scrollbar-track {
          background: #eef2f7;
        }

        ::-webkit-scrollbar-thumb {
          border: 3px solid #eef2f7;
          border-radius: 999px;
          background: #9aabc2;
        }

        ::-webkit-scrollbar-thumb:hover {
          background: #7185a1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
